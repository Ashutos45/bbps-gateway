services:
  - type: web
    name: bbps-gateway-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: HMAC_SECRET
        value: ugVz1hETNXUIwnWtpLafAASFPL0qGI5fAWybWMfuEsIL3HusiIRWO1AvVmBRe0Gy
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173,http://localhost:4173,https://your-frontend.vercel.app"
